name: pixelreforge

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PIXELREFORGE_DOMAIN: ${PIXELREFORGE_DOMAIN:?Set PIXELREFORGE_DOMAIN}
      PIXELREFORGE_SPRITE_SHEET_MAX_REQUEST_SIZE: ${PIXELREFORGE_SPRITE_SHEET_MAX_REQUEST_SIZE:-70MiB}
    volumes:
      - ./infra/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

  api:
    image: ghcr.io/${PIXELREFORGE_GHCR_OWNER:?Set PIXELREFORGE_GHCR_OWNER}/pixelreforge-api:${PIXELREFORGE_IMAGE_TAG:?Set PIXELREFORGE_IMAGE_TAG}
    pull_policy: always
    restart: unless-stopped
    environment:
      PIXELREFORGE_ENV: production
      PIXELREFORGE_DEBUG: "false"
      PIXELREFORGE_LOG_FORMAT: json
      PIXELREFORGE_LOG_LEVEL: ${PIXELREFORGE_LOG_LEVEL:-INFO}
      PIXELREFORGE_CORS_ORIGINS: ${PIXELREFORGE_CORS_ORIGINS:?Set PIXELREFORGE_CORS_ORIGINS}
      PIXELREFORGE_SESSION_SECRET: ${PIXELREFORGE_SESSION_SECRET:?Set PIXELREFORGE_SESSION_SECRET}
      PIXELREFORGE_SESSION_COOKIE_NAME: ${PIXELREFORGE_SESSION_COOKIE_NAME:-pixelreforge_session}
      PIXELREFORGE_SESSION_MAX_AGE_SECONDS: ${PIXELREFORGE_SESSION_MAX_AGE_SECONDS:-2592000}
      PIXELREFORGE_SENTRY_DSN: ${PIXELREFORGE_SENTRY_DSN:-}
      PIXELREFORGE_SENTRY_TRACES_SAMPLE_RATE: ${PIXELREFORGE_SENTRY_TRACES_SAMPLE_RATE:-0.0}
      PIXELREFORGE_DATABASE_URL: sqlite:////app/runtime/pixelreforge.sqlite3
      PIXELREFORGE_JOB_MAX_ATTEMPTS: ${PIXELREFORGE_JOB_MAX_ATTEMPTS:-3}
      PIXELREFORGE_JOB_TIMEOUT_SECONDS: ${PIXELREFORGE_JOB_TIMEOUT_SECONDS:-1800}
      PIXELREFORGE_JOB_TTL_SECONDS: ${PIXELREFORGE_JOB_TTL_SECONDS:-86400}
      PIXELREFORGE_SPRITE_SHEET_MAX_FILES: ${PIXELREFORGE_SPRITE_SHEET_MAX_FILES:-128}
      PIXELREFORGE_SPRITE_SHEET_MAX_FRAMES: ${PIXELREFORGE_SPRITE_SHEET_MAX_FRAMES:-4096}
      PIXELREFORGE_SPRITE_SHEET_MAX_FILE_BYTES: ${PIXELREFORGE_SPRITE_SHEET_MAX_FILE_BYTES:-16777216}
      PIXELREFORGE_SPRITE_SHEET_MAX_TOTAL_BYTES: ${PIXELREFORGE_SPRITE_SHEET_MAX_TOTAL_BYTES:-67108864}
      PIXELREFORGE_SPRITE_SHEET_MAX_PIXELS: ${PIXELREFORGE_SPRITE_SHEET_MAX_PIXELS:-8000000}
      PIXELREFORGE_SPRITE_SHEET_MAX_TOTAL_PIXELS: ${PIXELREFORGE_SPRITE_SHEET_MAX_TOTAL_PIXELS:-8000000}
      PIXELREFORGE_SPRITE_SHEET_MAX_ATLAS_PIXELS: ${PIXELREFORGE_SPRITE_SHEET_MAX_ATLAS_PIXELS:-16000000}
      PIXELREFORGE_SPRITE_SHEET_MAX_REQUEST_BYTES: ${PIXELREFORGE_SPRITE_SHEET_MAX_REQUEST_BYTES:-73400320}
    volumes:
      - pixelreforge-runtime:/app/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    image: ghcr.io/${PIXELREFORGE_GHCR_OWNER:?Set PIXELREFORGE_GHCR_OWNER}/pixelreforge-api:${PIXELREFORGE_IMAGE_TAG:?Set PIXELREFORGE_IMAGE_TAG}
    pull_policy: always
    command: ["python", "-m", "pixelreforge_api.worker"]
    restart: unless-stopped
    environment:
      PIXELREFORGE_ENV: production
      PIXELREFORGE_DEBUG: "false"
      PIXELREFORGE_LOG_FORMAT: json
      PIXELREFORGE_LOG_LEVEL: ${PIXELREFORGE_LOG_LEVEL:-INFO}
      PIXELREFORGE_SESSION_SECRET: ${PIXELREFORGE_SESSION_SECRET:?Set PIXELREFORGE_SESSION_SECRET}
      PIXELREFORGE_SENTRY_DSN: ${PIXELREFORGE_SENTRY_DSN:-}
      PIXELREFORGE_SENTRY_TRACES_SAMPLE_RATE: ${PIXELREFORGE_SENTRY_TRACES_SAMPLE_RATE:-0.0}
      PIXELREFORGE_DATABASE_URL: sqlite:////app/runtime/pixelreforge.sqlite3
      PIXELREFORGE_JOB_MAX_ATTEMPTS: ${PIXELREFORGE_JOB_MAX_ATTEMPTS:-3}
      PIXELREFORGE_JOB_TIMEOUT_SECONDS: ${PIXELREFORGE_JOB_TIMEOUT_SECONDS:-1800}
      PIXELREFORGE_JOB_TTL_SECONDS: ${PIXELREFORGE_JOB_TTL_SECONDS:-86400}
      PIXELREFORGE_WORKER_CONCURRENCY: ${PIXELREFORGE_WORKER_CONCURRENCY:-1}
      PIXELREFORGE_WORKER_ID: ${PIXELREFORGE_WORKER_ID:-default}
    volumes:
      - pixelreforge-runtime:/app/runtime
    depends_on:
      api:
        condition: service_healthy

  web:
    image: ghcr.io/${PIXELREFORGE_GHCR_OWNER:?Set PIXELREFORGE_GHCR_OWNER}/pixelreforge-web:${PIXELREFORGE_IMAGE_TAG:?Set PIXELREFORGE_IMAGE_TAG}
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      ORIGIN: ${PIXELREFORGE_PUBLIC_ORIGIN:?Set PIXELREFORGE_PUBLIC_ORIGIN}
      PUBLIC_API_BASE_URL: ${PIXELREFORGE_PUBLIC_API_BASE_URL:?Set PIXELREFORGE_PUBLIC_API_BASE_URL}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pixelreforge-runtime:
  caddy-data:
  caddy-config:
