[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelreforge-api"
version = "0.1.0"
description = "FastAPI backend for PixelReForge."
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
authors = [
  { name = "WindOfEchos" },
]
dependencies = [
  "fastapi>=0.115",
  "pixelreforge-core>=0.1.0",
  "pydantic>=2.0",
  "python-multipart>=0.0.9",
  "sentry-sdk[fastapi]>=2.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27",
  "pytest>=8.3",
]

[tool.setuptools.packages.find]
include = ["pixelreforge_api*"]
