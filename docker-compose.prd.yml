services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PIXELREFORGE_DOMAIN: ${PIXELREFORGE_DOMAIN}
    volumes:
      - ./infra/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      PIXELREFORGE_ENV: production
      PIXELREFORGE_DEBUG: "false"
      PIXELREFORGE_LOG_FORMAT: json
      PIXELREFORGE_LOG_LEVEL: ${PIXELREFORGE_LOG_LEVEL:-INFO}
      PIXELREFORGE_CORS_ORIGINS: ${PIXELREFORGE_CORS_ORIGINS}
      PIXELREFORGE_SESSION_SECRET: ${PIXELREFORGE_SESSION_SECRET}
      PIXELREFORGE_SESSION_COOKIE_NAME: ${PIXELREFORGE_SESSION_COOKIE_NAME:-pixelreforge_session}
      PIXELREFORGE_SESSION_MAX_AGE_SECONDS: ${PIXELREFORGE_SESSION_MAX_AGE_SECONDS:-2592000}
      PIXELREFORGE_SENTRY_DSN: ${PIXELREFORGE_SENTRY_DSN:-}
      PIXELREFORGE_SENTRY_TRACES_SAMPLE_RATE: ${PIXELREFORGE_SENTRY_TRACES_SAMPLE_RATE:-0.0}
      PIXELREFORGE_DATABASE_URL: sqlite:////app/runtime/pixelreforge.sqlite3
      PIXELREFORGE_JOB_MAX_ATTEMPTS: ${PIXELREFORGE_JOB_MAX_ATTEMPTS:-3}
      PIXELREFORGE_JOB_TIMEOUT_SECONDS: ${PIXELREFORGE_JOB_TIMEOUT_SECONDS:-1800}
      PIXELREFORGE_JOB_TTL_SECONDS: ${PIXELREFORGE_JOB_TTL_SECONDS:-86400}
    volumes:
      - pixelreforge-runtime:/app/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: ["python", "-m", "pixelreforge_api.worker"]
    restart: unless-stopped
    environment:
      PIXELREFORGE_ENV: production
      PIXELREFORGE_DEBUG: "false"
      PIXELREFORGE_LOG_FORMAT: json
      PIXELREFORGE_LOG_LEVEL: ${PIXELREFORGE_LOG_LEVEL:-INFO}
      PIXELREFORGE_SESSION_SECRET: ${PIXELREFORGE_SESSION_SECRET}
      PIXELREFORGE_SENTRY_DSN: ${PIXELREFORGE_SENTRY_DSN:-}
      PIXELREFORGE_SENTRY_TRACES_SAMPLE_RATE: ${PIXELREFORGE_SENTRY_TRACES_SAMPLE_RATE:-0.0}
      PIXELREFORGE_DATABASE_URL: sqlite:////app/runtime/pixelreforge.sqlite3
      PIXELREFORGE_JOB_MAX_ATTEMPTS: ${PIXELREFORGE_JOB_MAX_ATTEMPTS:-3}
      PIXELREFORGE_JOB_TIMEOUT_SECONDS: ${PIXELREFORGE_JOB_TIMEOUT_SECONDS:-1800}
      PIXELREFORGE_JOB_TTL_SECONDS: ${PIXELREFORGE_JOB_TTL_SECONDS:-86400}
      PIXELREFORGE_WORKER_CONCURRENCY: ${PIXELREFORGE_WORKER_CONCURRENCY:-1}
      PIXELREFORGE_WORKER_ID: ${PIXELREFORGE_WORKER_ID:-default}
    volumes:
      - pixelreforge-runtime:/app/runtime
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      ORIGIN: https://${PIXELREFORGE_DOMAIN}
      PUBLIC_API_BASE_URL: https://${PIXELREFORGE_DOMAIN}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pixelreforge-runtime:
  caddy-data:
  caddy-config:
