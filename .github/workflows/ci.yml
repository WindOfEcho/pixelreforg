name: CI

on:
  push:
    branches:
      - dev
      - main
      - 'hotfix/**'
  pull_request:
    branches:
      - dev
      - main
      - 'hotfix/**'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff mypy
          python -m pip install -e "packages/core[test]" -e "apps/api[test]"

      - name: Ruff
        run: python -m ruff check apps packages tests scripts

      - name: MyPy
        run: python -m mypy packages/core/pixelreforge_core apps/api/pixelreforge_api --ignore-missing-imports

      - name: Pytest
        run: python -m pytest

  web:
    name: Web
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs:
      - python
      - web

    env:
      PIXELREFORGE_GHCR_OWNER: pixelreforge
      PIXELREFORGE_IMAGE_TAG: v0.0.0
      PIXELREFORGE_DOMAIN: example.com
      PIXELREFORGE_PUBLIC_ORIGIN: https://example.com
      PIXELREFORGE_PUBLIC_API_BASE_URL: https://example.com
      PIXELREFORGE_CORS_ORIGINS: https://example.com
      PIXELREFORGE_SESSION_SECRET: ci-session-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate development compose
        run: docker compose -f docker-compose.yml config

      - name: Validate production compose
        run: docker compose -f compose.prod.yml config

      - name: Build API image
        run: docker build --file infra/docker/api.Dockerfile --tag pixelreforge-api:ci .

      - name: Build Web image
        run: docker build --file infra/docker/web.Dockerfile --tag pixelreforge-web:ci .
