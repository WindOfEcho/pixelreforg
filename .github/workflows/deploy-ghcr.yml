name: Deploy GHCR Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to deploy, for example v0.2.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SERVER_HOST: ${{ secrets.SERVER_HOST || vars.SERVER_HOST }}
  SERVER_USER: ${{ secrets.SERVER_USER || vars.SERVER_USER || 'deploy' }}
  SERVER_PORT: ${{ secrets.SERVER_PORT || vars.SERVER_PORT || '22' }}
  SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
  SERVER_SSH_KNOWN_HOSTS: ${{ secrets.SERVER_SSH_KNOWN_HOSTS }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version
        id: release
        run: |
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Deploy version must use vX.Y.Z format." >&2
            exit 1
          fi
          git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare image metadata
        id: image
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Verify published images exist
        run: |
          docker manifest inspect "${REGISTRY}/${{ steps.image.outputs.owner }}/pixelreforge-api:${{ steps.release.outputs.version }}" >/dev/null
          docker manifest inspect "${REGISTRY}/${{ steps.image.outputs.owner }}/pixelreforge-web:${{ steps.release.outputs.version }}" >/dev/null

      - name: Configure SSH
        run: |
          if [[ -z "$SERVER_HOST" ]]; then
            echo "SERVER_HOST is required." >&2
            exit 1
          fi
          if [[ -z "$SERVER_USER" ]]; then
            echo "SERVER_USER is required." >&2
            exit 1
          fi
          if [[ -z "$SERVER_SSH_KEY" ]]; then
            echo "SERVER_SSH_KEY secret is required." >&2
            exit 1
          fi

          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/pixelreforge_deploy_key
          printf '%s\n' "$SERVER_SSH_KEY" | tr -d '\r' > ~/.ssh/pixelreforge_deploy_key
          if [[ -n "$SERVER_SSH_KNOWN_HOSTS" ]]; then
            printf '%s\n' "$SERVER_SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          else
            ssh-keyscan -H -p "$SERVER_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Run server deploy script
        run: |
          ssh -i ~/.ssh/pixelreforge_deploy_key \
            -p "$SERVER_PORT" \
            -o IdentitiesOnly=yes \
            "$SERVER_USER@$SERVER_HOST" \
            "sudo /usr/local/bin/pixelreforge-deploy '${{ steps.release.outputs.version }}'"
