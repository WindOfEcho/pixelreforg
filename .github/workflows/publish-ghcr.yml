name: Publish GHCR Images

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ghcr-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vX.Y.Z format." >&2
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Release tag must point to a commit contained in main." >&2
            exit 1
          fi

      - name: Prepare image metadata
        id: image
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "source=https://github.com/${GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.owner }}/pixelreforge-api:${{ steps.image.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.owner }}/pixelreforge-api:latest
          labels: |
            org.opencontainers.image.title=PixelReForge API
            org.opencontainers.image.description=FastAPI backend and worker runtime for PixelReForge.
            org.opencontainers.image.source=${{ steps.image.outputs.source }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      - name: Publish Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.owner }}/pixelreforge-web:${{ steps.image.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.owner }}/pixelreforge-web:latest
          labels: |
            org.opencontainers.image.title=PixelReForge Web
            org.opencontainers.image.description=SvelteKit frontend runtime for PixelReForge.
            org.opencontainers.image.source=${{ steps.image.outputs.source }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
